name: Build VigiRoutes Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties

      - name: Decoder et verifier keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vigiroutes-release.jks
          SIZE=$(stat -c%s android/app/vigiroutes-release.jks 2>/dev/null || echo 0)
          echo "Taille keystore: $SIZE octets"
          if [ "$SIZE" -lt 100 ]; then
            echo "SECRET VIDE OU CORROMPU - creation nouveau keystore"
            keytool -genkey -v \
              -keystore android/app/vigiroutes-release.jks \
              -alias vigiroutes \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "vigiroutes2024" \
              -keypass "vigiroutes2024" \
              -dname "CN=VigiRoutes, OU=OYOP, O=OYOPMT, L=Abidjan, ST=Abidjan, C=CI"
            echo "NOUVEAU_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "Keystore OK ($SIZE octets)"
            keytool -list -keystore android/app/vigiroutes-release.jks \
              -storepass "${{ secrets.STORE_PASSWORD }}" || echo "MOT DE PASSE INCORRECT"
            echo "NOUVEAU_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Create key.properties
        run: |
          if [ "$NOUVEAU_KEYSTORE" = "true" ]; then
            PASS="vigiroutes2024"
          else
            PASS="${{ secrets.STORE_PASSWORD }}"
            KEYPASS="${{ secrets.KEY_PASSWORD }}"
          fi
          echo "storeFile=${{ github.workspace }}/android/app/vigiroutes-release.jks" > android/key.properties
          echo "storePassword=$PASS" >> android/key.properties
          echo "keyAlias=vigiroutes" >> android/key.properties
          echo "keyPassword=${KEYPASS:-$PASS}" >> android/key.properties

      - name: Remove duplicate MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/ci/oyopmt/vigiroutes/vigiroutes_provider

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK Release
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release

      - name: Chercher APK produit
        if: always()
        run: find /home/runner/work -name "*.apk" 2>/dev/null | head -20 || echo "Aucun APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vigiroutes-pro-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
