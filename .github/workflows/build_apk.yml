name: Build VigiRoutes Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vigiroutes-release.jks
          echo "Keystore size: $(wc -c < android/app/vigiroutes-release.jks) bytes"

      - name: Remove duplicate MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/ci/oyopmt/vigiroutes/vigiroutes_provider

      - name: Flutter pub get
        run: flutter pub get

      - name: Create key.properties
        run: |
          echo "storeFile=${{ github.workspace }}/android/app/vigiroutes-release.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}"                          >> android/key.properties
          echo "keyAlias=vigiroutes"                                                  >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"                              >> android/key.properties
          echo "=== key.properties ===" && cat android/key.properties
          echo "=== keystore ===" && ls -lh android/app/vigiroutes-release.jks

      - name: Build APK Release
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GRADLE_OPTS: "-Xmx4g -Xms512m -XX:+HeapDumpOnOutOfMemoryError"
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: flutter build apk --release --verbose 2>&1 | tail -200

      - name: Chercher l'APK produit
        if: always()
        run: find /home/runner/work -name "*.apk" 2>/dev/null || echo "Aucun APK trouvé"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vigiroutes-pro-${{ github.run_number }}
          path: android/app/build/outputs/flutter-apk/app-release.apk
          retention-days: 30
